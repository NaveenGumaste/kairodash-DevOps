---
- name: Configure KairoDash server
  hosts: kairodash
  become: true

  tasks:
    - name: Update DNF package cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true
