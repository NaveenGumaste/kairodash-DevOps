name: CI

on:
  push:
    branches:
      - main
      - "devops/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  application:
    name: Application Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build application
        run: bun run build

      - name: Lint
        run: bun run lint
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug AWS role variable
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          echo "ROLE_ARN length: ${#ROLE_ARN}"

          if [[ -z "$ROLE_ARN" ]]; then
            echo "ERROR: AWS_ROLE_ARN is empty"
            exit 1
          fi

          if [[ "$ROLE_ARN" == arn:aws:iam::*:role/* ]]; then
            echo "ROLE_ARN format: VALID"
          else
            echo "ROLE_ARN format: INVALID"
            echo "First characters: ${ROLE_ARN:0:12}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: kairodash:ci

      - name: Verify image
        run: docker image inspect kairodash:ci

      - name: Start container
        run: |
          docker run -d \
            --name kairodash-ci \
            -p 3000:3000 \
            kairodash:ci

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo "KairoDash health check passed."
              exit 0
            fi
            echo "Waiting for KairoDash..."
            sleep 2
          done

          echo "KairoDash failed health check."
          docker logs kairodash-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f kairodash-ci
