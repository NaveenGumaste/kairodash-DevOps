name: CI

on:
  push:
    branches:
      - main
      - "devops/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  application:
    name: Application Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build application
        run: bun run build

      - name: Lint
        run: bun run lint
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "307796195748"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ============================================================
      # Docker
      # ============================================================

      # Host is amd64; image is linux/arm64 for t4g.micro. QEMU lets docker run it here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: kairodash:ci

      # ============================================================
      # Container Smoke Test
      # ============================================================

      - name: Verify image
        run: |
          docker image inspect kairodash:ci --format 'architecture={{.Architecture}} os={{.Os}}'

      - name: Start container
        run: |
          docker run -d \
            --name kairodash-ci \
            -p 3000:3000 \
            kairodash:ci

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo "KairoDash health check passed."
              exit 0
            fi

            echo "Waiting for KairoDash..."
            sleep 2
          done

          echo "KairoDash failed health check."
          docker logs kairodash-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f kairodash-ci

      # ============================================================
      # Amazon ECR
      # ============================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: kairodash
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            kairodash:ci \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: kairodash
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "307796195748"

      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          ECR_REGISTRY: 307796195748.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: kairodash
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy KairoDash ${IMAGE_TAG}" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker rm -f kairodash 2>/dev/null || true",
              "docker run -d --name kairodash --restart unless-stopped -p 3000:3000 '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "sleep 5",
              "curl --fail --silent http://127.0.0.1:3000/api/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
              --output json
            exit 1
          fi

          echo "KairoDash deployment succeeded."
